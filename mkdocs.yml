# Project
site_name: Open Energy Metadata
site_url: https://openenergyplatform.github.io/oemetadata/
site_description: Documentation of the Open Energy Metadata (OEMetadata) standard

# Repository
repo_name: OpenEnergyPlatform/oemetadata
repo_url: https://github.com/OpenEnergyPlatform/oemetadata
docs_dir: docs

# Configuration
theme:
  name: material
  logo: img/OpenEnergyFamily_Logo_OEMetadata_white.png
  palette:
      # Palette toggle for light mode
      - scheme: default
        toggle:
          icon: material/brightness-7
          name: Switch to dark mode
      # Palette toggle for dark mode
      - scheme: slate
        toggle:
          icon: material/brightness-4
          name: Switch to light mode
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.tracking
    - navigation.top
    - toc.follow

# extensions
markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: "#"

plugins:
- mkdocstrings:
    default_handler: python
- search:
    separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'

# Customization
extra:
  generator: false
  version:
    provider: mike
  homepage: https://openenergyplatform.org/

extra_css:
  - extra.css

# Navigation
nav:
  - Home: index.md
  - Development:
    - Documentation:
        - development/documentation/index.md
    - Collaboration:
      - development/collaboration/index.md
      - License and Citation: development/collaboration/license_and_citation.md
      - Git: development/collaboration/git.md
      - Users: development/collaboration/users.md
      - Chat: development/collaboration/chat.md
      - Meetings: development/collaboration/meeting.md
      - Code of Conduct: development/collaboration/code_of_conduct.md
    - Release:
      - development/release/index.md
  - Metadata Documentation:
      - oemetadata/index.md
      - Metadata Key Description: oemetadata/metadata_key_description.md
      - Metadata Key Details: oemetadata/metadata_key_details.md
      - Crosswalks and Mappings: oemetadata/metadata_mappings.md
  - User Documentation:
    - Install:
      - user_documentation/install/index.md
    - Functions:
      - user_documentation/functions/index.md
    - Tests:
      - user_documentation/test/index.md
